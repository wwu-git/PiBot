name: README contributors

on:
  push:
    branches: [main]
  schedule:
    # GitHub can serve cached contributor data for a few hours after a push.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-contributors

jobs:
  refresh:
    if: github.repository == 'w01fb0ss/PiBot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Refresh the English README
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            if [ "$attempt" != 1 ]; then
              git fetch origin main
              git switch --detach FETCH_HEAD
            fi
            node tools/dev/update-readme-contributors.ts
            if git diff --quiet -- README.md; then exit 0; fi
            git add -- README.md
            git commit --signoff -m 'docs: refresh contributor credits'
            if git push origin HEAD:refs/heads/main; then exit 0; fi
          done
          exit 1
